<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>자전거 헬멧 착용 감지 AI 시스템 (최종 수정본)</title>
    <style>
        :root {
            --primary-color: #2c3e50;
            --success-color: #2ecc71;
            --danger-color: #e74c3c;
        }
        body {
            font-family: 'Malgun Gothic', sans-serif;
            background-color: #f5f6fa;
            margin: 0;
            padding: 20px;
            color: #333;
        }
        .container {
            max-width: 700px;
            margin: 0 auto;
            background: white;
            padding: 30px;
            border-radius: 12px;
            box-shadow: 0 4px 15px rgba(0,0,0,0.1);
        }
        h1 {
            text-align: center;
            color: var(--primary-color);
            margin-bottom: 5px;
        }
        .subtitle {
            text-align: center;
            color: #7f8c8d;
            margin-bottom: 25px;
            font-size: 14px;
        }
        /* 업로드 영역 */
        .upload-zone {
            border: 2px dashed #3498db;
            padding: 50px 20px;
            text-align: center;
            border-radius: 8px;
            background: #fdfdfd;
            cursor: pointer;
            transition: 0.3s;
        }
        .upload-zone:hover {
            background: #f1f7fc;
        }
        #fileInput { display: none; }
        
        /* 결과 출력 영역 */
        .result-container {
            margin-top: 25px;
            text-align: center;
        }
        #canvasContainer {
            position: relative;
            display: inline-block;
            max-width: 100%;
            margin-top: 15px;
        }
        #resultCanvas {
            max-width: 100%;
            border-radius: 8px;
            box-shadow: 0 2px 8px rgba(0,0,0,0.1);
            display: none;
        }
        /* 경고 및 알림 메시지 */
        .alert-box {
            padding: 15px;
            border-radius: 8px;
            font-size: 16px;
            font-weight: bold;
            margin-top: 20px;
            display: none;
            line-height: 1.5;
            text-align: left;
        }
        .alert-box.safe {
            background-color: #d4edda;
            color: #155724;
            border: 1px solid #c3e6cb;
        }
        .alert-box.danger {
            background-color: #f8d7da;
            color: #721c24;
            border: 1px solid #f5c6cb;
        }
        .loading {
            display: none;
            color: #3498db;
            font-weight: bold;
            margin-top: 15px;
        }
    </style>
</head>
<body>

<div class="container">
    <h1>⛑️ 자전거 헬멧 착용 판별 AI</h1>
    <div class="subtitle">Roboflow Serverless Workflow API 시스템 (정밀 수정본)</div>

    <div class="upload-zone" onclick="document.getElementById('fileInput').click()">
        <p style="font-size: 16px; font-weight: bold; margin: 0;">📸 이곳을 클릭하여 자전거 타는 사람 사진을 업로드하세요.</p>
        <p style="color: #888; font-size: 13px; margin-top: 5px;">이미지를 업로드하면 즉시 AI 워크플로우 분석을 시작합니다.</p>
        <input type="file" id="fileInput" accept="image/*">
    </div>

    <div class="result-container">
        <div id="loading" class="loading">Roboflow 워크플로우 분석 중...</div>
        
        <div id="alertBox" class="alert-box"></div>
        
        <div id="canvasContainer">
            <canvas id="resultCanvas"></canvas>
        </div>
    </div>
</div>

<script>
    // [설정 영역] 회원님의 고유 정보입니다.
    // ※ 주의: 파이썬 예시에 써있던 "cK2x4oNT9ymJUcWpR4nb"는 작동하지 않는 가짜 키일 수 있으니, 
    // 안된다면 본인의 진짜 API Key(대개 rf_로 시작하거나 긴 문자열)로 변경해 주세요.
    const API_KEY = "cK2x4oNT9ymJUcWpR4nb"; 
    const WORKSPACE = "cnsh31_3301_";
    const WORKFLOW_ID = "detect-and-classify";

    const fileInput = document.getElementById('fileInput');
    const resultCanvas = document.getElementById('resultCanvas');
    const ctx = resultCanvas.getContext('2d');
    const loading = document.getElementById('loading');
    const alertBox = document.getElementById('alertBox');

    fileInput.addEventListener('change', function(e) {
        const file = e.target.files[0];
        if (!file) return;

        alertBox.style.display = 'none';
        resultCanvas.style.display = 'none';
        loading.style.display = 'block';

        const reader = new FileReader();
        reader.onload = function(event) {
            const img = new Image();
            img.onload = function() {
                resultCanvas.width = img.width;
                resultCanvas.height = img.height;
                ctx.drawImage(img, 0, 0);
                resultCanvas.style.display = 'inline-block';

                const base64Data = event.target.result.split(',')[1];
                sendToRoboflowWorkflow(base64Data, img);
            }
            img.src = event.target.result;
        }
        reader.readAsDataURL(file);
    });

    function sendToRoboflowWorkflow(base64Data, originalImg) {
        // [수정 포인트 1] 워크스페이스가 앞으로 오도록 올바른 URL 주소 체계로 변경
        const url = `https://serverless.roboflow.com/${WORKSPACE}/workflows/${WORKFLOW_ID}`;

        // [수정 포인트 2] 규격에 맞는 완벽한 JSON 페이로드 구성
        const payload = {
            "api_key": API_KEY,
            "inputs": {
                "image": {
                    "type": "base64",
                    "value": base64Data
                }
            }
        };

        fetch(url, {
            method: "POST",
            headers: {
                "Content-Type": "application/json"
            },
            body: JSON.stringify(payload)
        })
        .then(response => {
            // [수정 포인트 3] 서버가 에러를 뱉으면 화면에 상세 내용을 띄우도록 가로채기
            if (!response.ok) {
                return response.text().then(text => {
                    throw new Error(`[HTTP ${response.status}] 서버 메시지: ${text}`);
                });
            }
            return response.json();
        })
        .then(data => {
            loading.style.display = 'none';
            console.log("Roboflow Response:", data);

            const predictions = findPredictions(data);

            if (predictions && predictions.length > 0) {
                drawPredictions(predictions, originalImg);
            } else {
                alertBox.style.display = 'block';
                alertBox.className = "alert-box";
                alertBox.style.backgroundColor = "#e2e3e5";
                alertBox.style.color = "#383d41";
                alertBox.innerText = "🔍 이미지에서 헬멧이나 사람 객체를 검출하지 못했습니다. 다른 사진으로 테스트해 보세요.";
            }
        })
        .catch(err => {
            loading.style.display = 'none';
            // 화면에 구체적인 에러를 빨간색으로 표기
            alertBox.style.display = 'block';
            alertBox.className = "alert-box danger";
            alertBox.innerHTML = `❌ 로보플로우 통신 실패!<br><span style="font-size:13px; font-weight:normal; font-family:monospace; word-break:break-all;">${err.message}</span><br><br><small style="font-weight:normal; color:#555;">* 해결책: 만약 HTTP 401이나 403 에러가 뜬다면 코드 104번째 줄의 API_KEY가 진짜 본인 키가 맞는지 확인해 주세요.</small>`;
            console.error(err);
        });
    }

    // 결과 데이터 구조에서 예측값(predictions) 배열을 찾아내는 재귀 함수
    function findPredictions(obj) {
        if (!obj || typeof obj !== 'object') return null;
        if (obj.predictions && Array.isArray(obj.predictions)) return obj.predictions;
        if (Array.isArray(obj) && obj.length > 0 && obj[0].x !== undefined) return obj;
        
        for (let key in obj) {
            if (obj.hasOwnProperty(key)) {
                let found = findPredictions(obj[key]);
                if (found) return found;
            }
        }
        return null;
    }

    function drawPredictions(predictions, img) {
        ctx.drawImage(img, 0, 0);
        let helmetCount = 0;
        let noHelmetCount = 0;

        predictions.forEach(pred => {
            const width = pred.width;
            const height = pred.height;
            const x = pred.x - width / 2;
            const y = pred.y - height / 2;
            
            const className = (pred.class || pred.label || "").toLowerCase();
            const confidence = Math.round((pred.confidence || 0) * 100);

            let color = "#e74c3c"; // 미착용 기본값 (빨강)
            
            if (className.includes("no") === false && (className.includes("helmet") || className.includes("wear") || className.includes("head_with_helmet"))) {
                color = "#2ecc71"; // 착용 확인 (초록)
                helmetCount++;
            } else {
                noHelmetCount++;
            }

            ctx.strokeStyle = color;
            ctx.lineWidth = Math.max(4, img.width / 200);
            ctx.strokeRect(x, y, width, height);

            ctx.fillStyle = color;
            const fontSize = Math.max(14, img.width / 50);
            ctx.font = `bold ${fontSize}px sans-serif`;
            const text = `${pred.class || "Object"} (${confidence}%)`;
            const textWidth = ctx.measureText(text).width;
            ctx.fillRect(x, y - fontSize - 5, textWidth + 10, fontSize + 5);

            ctx.fillStyle = "white";
            ctx.fillText(text, x + 5, y - 5);
        });

        alertBox.style.display = 'block';
        if (noHelmetCount > 0) {
            alertBox.className = "alert-box danger";
            alertBox.innerHTML = `⚠️ 경고: 헬멧 미착용자가 감지되었습니다!<br><span style="font-size:14px; font-weight:normal;">안전을 위해 반드시 자전거 헬멧을 착용해 주세요!</span>`;
        } else if (helmetCount > 0 && noHelmetCount === 0) {
            alertBox.className = "alert-box safe";
            alertBox.innerHTML = `✅ 안전: 모든 인원의 헬멧 착용이 확인되었습니다. 안전 운행하세요!`;
        }
    }
</script>

</body>
</html>
