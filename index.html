<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>자전거 헬멧 착용 감지 AI 시스템 (Workflow)</title>
    <style>
        :root {
            --primary-color: #2c3e50;
            --success-color: #2ecc71;
            --danger-color: #e74c3c;
        }
        body {
            font-family: 'Malgun Gothic', sans-serif;
            background-color: #f5f6fa;
            margin: 0;
            padding: 20px;
            color: #333;
        }
        .container {
            max-width: 700px;
            margin: 0 auto;
            background: white;
            padding: 30px;
            border-radius: 12px;
            box-shadow: 0 4px 15px rgba(0,0,0,0.1);
        }
        h1 {
            text-align: center;
            color: var(--primary-color);
            margin-bottom: 5px;
        }
        .subtitle {
            text-align: center;
            color: #7f8c8d;
            margin-bottom: 25px;
            font-size: 14px;
        }
        /* 업로드 영역 */
        .upload-zone {
            border: 2px dashed #3498db;
            padding: 50px 20px;
            text-align: center;
            border-radius: 8px;
            background: #fdfdfd;
            cursor: pointer;
            transition: 0.3s;
        }
        .upload-zone:hover {
            background: #f1f7fc;
        }
        #fileInput { display: none; }
        
        /* 결과 출력 영역 */
        .result-container {
            margin-top: 25px;
            text-align: center;
        }
        #canvasContainer {
            position: relative;
            display: inline-block;
            max-width: 100%;
            margin-top: 15px;
        }
        #resultCanvas {
            max-width: 100%;
            border-radius: 8px;
            box-shadow: 0 2px 8px rgba(0,0,0,0.1);
            display: none;
        }
        /* 경고 및 알림 메시지 */
        .alert-box {
            padding: 15px;
            border-radius: 8px;
            font-size: 18px;
            font-weight: bold;
            margin-top: 20px;
            display: none;
            line-height: 1.5;
        }
        .alert-box.safe {
            background-color: #d4edda;
            color: #155724;
            border: 1px solid #c3e6cb;
        }
        .alert-box.danger {
            background-color: #f8d7da;
            color: #721c24;
            border: 1px solid #f5c6cb;
            animation: pulse 1.5s infinite;
        }
        .loading {
            display: none;
            color: #3498db;
            font-weight: bold;
            margin-top: 15px;
        }
        @keyframes pulse {
            0% { transform: scale(1); }
            50% { transform: scale(1.02); }
            100% { transform: scale(1); }
        }
    </style>
</head>
<body>

<div class="container">
    <h1>⛑️ 자전거 헬멧 착용 판별 AI</h1>
    <div class="subtitle">Roboflow Serverless Workflow 시스템 연동 완료</div>

    <div class="upload-zone" onclick="document.getElementById('fileInput').click()">
        <p style="font-size: 16px; font-weight: bold; margin: 0;">📸 이곳을 클릭하여 자전거 타는 사람 사진을 업로드하세요.</p>
        <p style="color: #888; font-size: 13px; margin-top: 5px;">이미지를 업로드하면 실시간으로 AI 분석을 요청합니다.</p>
        <input type="file" id="fileInput" accept="image/*">
    </div>

    <div class="result-container">
        <div id="loading" class="loading">Roboflow 워크플로우가 데이터를 분석 중입니다...</div>
        
        <div id="alertBox" class="alert-box"></div>
        
        <div id="canvasContainer">
            <canvas id="resultCanvas"></canvas>
        </div>
    </div>
</div>

<script>
    // 제공해주신 파이썬 설정값을 그대로 반영했습니다.
    const API_URL = "https://serverless.roboflow.com";
    const API_KEY = "cK2x4oNT9ymJUcWpR4nb";
    const WORKSPACE = "cnsh31_3301_";
    const WORKFLOW_ID = "detect-and-classify";

    const fileInput = document.getElementById('fileInput');
    const resultCanvas = document.getElementById('resultCanvas');
    const ctx = resultCanvas.getContext('2d');
    const loading = document.getElementById('loading');
    const alertBox = document.getElementById('alertBox');

    fileInput.addEventListener('change', function(e) {
        const file = e.target.files[0];
        if (!file) return;

        alertBox.style.display = 'none';
        resultCanvas.style.display = 'none';
        loading.style.display = 'block';

        const reader = new FileReader();
        reader.onload = function(event) {
            const img = new Image();
            img.onload = function() {
                resultCanvas.width = img.width;
                resultCanvas.height = img.height;
                ctx.drawImage(img, 0, 0);
                resultCanvas.style.display = 'inline-block';

                // base64 순수 데이터만 추출
                const base64Data = event.target.result.split(',')[1];
                sendToRoboflowWorkflow(base64Data, img);
            }
            img.src = event.target.result;
        }
        reader.readAsDataURL(file);
    });

    function sendToRoboflowWorkflow(base64Data, originalImg) {
        // 워크플로우 전용 API URL 구조 생성
        const url = `${API_URL}/workflows/${WORKSPACE}/${WORKFLOW_ID}?api_key=${API_KEY}`;

        // 워크플로우는 JSON 형식으로 base64 객체를 감싸서 보내야 합니다.
        const payload = {
            "image": {
                "type": "base64",
                "value": base64Data
            }
        };

        fetch(url, {
            method: "POST",
            headers: {
                "Content-Type": "application/json"
            },
            body: JSON.stringify(payload)
        })
        .then(response => response.json())
        .then(data => {
            loading.style.display = 'none';
            console.log("AI Response Data:", data); // 개발자 도구(F12) 콘솔에서 구조 확인 가능

            // 워크플로우 결과에서 유연하게 predictions(예측 배열)를 찾는 함수 호출
            const predictions = findPredictions(data);

            if (predictions && predictions.length > 0) {
                drawPredictions(predictions, originalImg);
            } else {
                // 검출된 박스가 없을 때
                alertBox.style.display = 'block';
                alertBox.className = "alert-box";
                alertBox.style.backgroundColor = "#e2e3e5";
                alertBox.style.color = "#383d41";
                alertBox.innerText = "🔍 이미지에서 인식된 객체가 없습니다. 다른 사진으로 시도해 보세요.";
            }
        })
        .catch(err => {
            loading.style.display = 'none';
            console.error(err);
            alert("서버 통신 중 오류가 발생했습니다. Console 창을 확인하세요.");
        });
    }

    // 워크플로우 복잡한 출력 구조 속에서 'predictions' 배열을 자동으로 찾아내는 스마트 탐색기
    function findPredictions(obj) {
        if (!obj || typeof obj !== 'object') return null;
        
        // 1. 객체 내부에 predictions 키가 있고 배열인 경우 바로 반환
        if (obj.predictions && Array.isArray(obj.predictions)) {
            return obj.predictions;
        }
        
        // 2. 현재 객체 자체가 이미 predictions 형태의 배열인 경우
        if (Array.isArray(obj) && obj.length > 0 && obj[0].x !== undefined) {
            return obj;
        }

        // 3. 하위 구조 재귀 탐색 (워크플로우 출력 블록 이름이 무엇이든 찾아냄)
        for (let key in obj) {
            if (obj.hasOwnProperty(key)) {
                let found = findPredictions(obj[key]);
                if (found) return found;
            }
        }
        return null;
    }

    function drawPredictions(predictions, img) {
        ctx.drawImage(img, 0, 0);

        let helmetCount = 0;
        let noHelmetCount = 0;

        predictions.forEach(pred => {
            // 좌표 정보 추출
            const width = pred.width;
            const height = pred.height;
            const x = pred.x - width / 2;
            const y = pred.y - height / 2;
            
            // 클래스 이름 판별 (소문자 변환)
            const className = (pred.class || pred.label || "").toLowerCase();
            const confidence = Math.round((pred.confidence || 0) * 100);

            // 헬멧 착용 여부 판별 로직
            let color = "#e74c3c"; // 기본값: 미착용 (빨간색)
            
            // 클래스명에 'no'가 없고, 'helmet'이나 'wear' 등이 포함되면 착용으로 판단
            if (className.includes("no") === false && (className.includes("helmet") || className.includes("wear") || className === "head_with_helmet")) {
                color = "#2ecc71"; // 착용 (초록색)
                helmetCount++;
            } else {
                noHelmetCount++;
            }

            // Canvas 박스 시각화
            ctx.strokeStyle = color;
            ctx.lineWidth = Math.max(4, img.width / 200);
            ctx.strokeRect(x, y, width, height);

            // 텍스트 라벨 배경
            ctx.fillStyle = color;
            const fontSize = Math.max(14, img.width / 50);
            ctx.font = `bold ${fontSize}px sans-serif`;
            const text = `${pred.class || "Object"} (${confidence}%)`;
            const textWidth = ctx.measureText(text).width;
            
            ctx.fillRect(x, y - fontSize - 5, textWidth + 10, fontSize + 5);

            // 텍스트 출력
            ctx.fillStyle = "white";
            ctx.fillText(text, x + 5, y - 5);
        });

        // 📢 안내 및 경고 메시지 출력 시스템
        alertBox.style.display = 'block';
        if (noHelmetCount > 0) {
            alertBox.className = "alert-box danger";
            alertBox.innerHTML = `⚠️ 경고: 헬멧을 착용하지 않은 상태가 감지되었습니다!<br><span style="font-size:15px; font-weight:normal;">안전한 주행을 위해 자전거 헬멧을 반드시 착용해 주세요!</span>`;
        } else if (helmetCount > 0 && noHelmetCount === 0) {
            alertBox.className = "alert-box safe";
            alertBox.innerHTML = `✅ 안전: 헬멧 착용이 확인되었습니다. 안전 운행하세요!`;
        }
    }
</script>

</body>
</html>
